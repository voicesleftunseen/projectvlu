<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <title>Mission | Voices Left Unseen</title>
  <style>
    :root {
      --bg-white: #ffffff;
      --deep-navy: #0a1628;
      --navy-light: #1a2a4a;
      --slate-muted: #3d5a80;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-white);
      color: var(--deep-navy);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* NAV */
    nav {
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }

    .logo-badge {
      width: 45px;
      height: 45px;
      background: var(--deep-navy);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg-white);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .nav-logo-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--deep-navy);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--deep-navy);
      text-decoration: none;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .nav-links a:hover { opacity: 0.5; }
    .nav-links a.active { font-weight: 600; border-bottom: 2px solid var(--deep-navy); }

    @media (max-width: 850px) {
      nav { padding: 1.5rem; flex-direction: column; gap: 1rem; }
      .nav-links { flex-wrap: wrap; justify-content: center; gap: 1rem; }
    }

    /* MAIN CONTENT */
    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
      width: 100%;
    }

    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--slate-muted);
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 4.5vw, 3.5rem);
      font-weight: 300;
      color: var(--deep-navy);
      margin-bottom: 2rem;
      line-height: 1.2;
    }

    .section-body p {
      font-size: 1.1rem;
      color: var(--deep-navy);
      line-height: 1.9;
      margin-bottom: 1.5rem;
    }

    .section-body p strong {
      font-weight: 600;
    }

    /* IMPACT STATS */
    .impact-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 2rem;
      margin-top: 4rem;
      padding-top: 3rem;
      border-top: 1px solid rgba(10, 22, 40, 0.1);
      text-align: center;
    }

      font-
